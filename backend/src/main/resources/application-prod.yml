# Production profile: only environment-specific overrides
# Common settings (Hikari, server, management) live in application.yml
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 20
        order_inserts: true
        order_updates: true
        generate_statistics: false

logging:
  level:
    com.verireview: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} traceId=%X{traceId} - %msg%n"

app:
  jwt:
    secret: ${JWT_SIGNING_KEY}
    access-minutes: 15
    refresh-days: 7
  auth:
    rate-limit-per-minute: 100
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  sandbox:
    docker-enabled: ${DOCKER_SANDBOX_ENABLED:true}
  ai-service:
    url: ${AI_SERVICE_INTERNAL_URL}
    secret: ${AI_SERVICE_INTERNAL_SECRET}
    timeout-seconds: 120
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true